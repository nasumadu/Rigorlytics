# Rigorlytics security pipeline.
#
# Runs on every push and pull request. Builds the image, then runs the same
# three scanners used locally, and FAILS the job on HIGH or CRITICAL image
# vulnerabilities. A gate that only reports is a dashboard, not a gate.
#
# Job order is deliberate: the cheap checks that need no image run first, so
# a leaked credential or a bad manifest fails in seconds rather than after
# a four-minute build.

name: security

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  # Weekly run on a fixed schedule. New CVEs get published against images
  # that were clean when they shipped, so scanning only at build time means
  # the result goes stale the moment it is green.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- secrets
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the scanner sees credentials committed earlier
          # and later removed. A secret deleted in a follow-up commit is
          # still in the history, and still compromised.
          fetch-depth: 0

      - name: Trivy secret scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: secret
          skip-dirs: venv,.venv,security-reports
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: "1"
          format: table

  # ------------------------------------------------------------ iac / config
  config:
    name: IaC and config scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy config scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          # Covers the Dockerfile, compose file and everything under k8s/.
          # Picks up terraform/ automatically once that exists.
          scan-ref: .
          skip-dirs: venv,.venv,security-reports
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: "1"
          # trivy-config honours .trivyignore from the repo root, so the
          # documented AVD-KSV-01010 exception applies here too.
          format: table

  # ----------------------------------------------------------------- image
  image:
    name: Build and scan image
    runs-on: ubuntu-latest
    # Fail fast on the cheap jobs before spending time on a build.
    needs: [secrets, config]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          # Load into the local daemon rather than pushing: this pipeline
          # gates the image, it does not publish it. Add a push step with
          # ECR or GHCR credentials when there is somewhere to push to.
          load: true
          push: false
          tags: rigorlytics:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan (report everything)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: rigorlytics:${{ github.sha }}
          scanners: vuln
          ignore-unfixed: true
          severity: LOW,MEDIUM,HIGH,CRITICAL
          format: table
          exit-code: "0"

      - name: Trivy image scan (SARIF for code scanning)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: rigorlytics:${{ github.sha }}
          scanners: vuln
          ignore-unfixed: true
          format: sarif
          output: trivy-image.sarif
          exit-code: "0"

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v3
        # Code scanning needs a public repo or GitHub Advanced Security on a
        # private one. Without either, this step 403s, and that should not
        # fail an otherwise good build.
        continue-on-error: true
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Keep the reports as artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports-${{ github.sha }}
          path: trivy-image.sarif
          retention-days: 30
          if-no-files-found: ignore

      # THE GATE. Everything above reports; this one decides.
      - name: Gate on HIGH and CRITICAL
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: rigorlytics:${{ github.sha }}
          scanners: vuln
          # --ignore-unfixed matters: a CVE with no available patch is a
          # tracked risk, not something a developer can action by merging.
          # Gating on unfixable findings trains people to bypass the gate.
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table

  # --------------------------------------------------------- manifest check
  manifests:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Client-side validation
        # Catches schema errors and typos without needing a cluster. Server
        # -side validation would catch more, but requires a live API server.
        run: |
          for f in k8s/*.yaml; do
            echo "--- $f"
            kubectl apply --dry-run=client --validate=true -f "$f" >/dev/null \
              && echo "    ok" \
              || { echo "    FAILED"; exit 1; }
          done
