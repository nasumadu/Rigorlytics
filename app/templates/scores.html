<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Scores — Rigorlytics</title>
<meta name="description" content="Live scores across the NFL, college football, NBA, college basketball, WNBA, MLB, NHL, Premier League and MLS.">
<style>
:root{
  --bg:#0E1621; --bg2:#0B1119; --card:#18242F; --card2:#1E2E3B;
  --green:#2FD07A; --greendk:#1E9E5A; --red:#F0625D; --amber:#F5B841;
  --text:#E9EFF5; --muted:#8AA0B4; --faint:#5E7286; --line:#2A3B4C;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--green);text-decoration:none}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}

nav{position:sticky;top:0;z-index:50;background:rgba(11,17,25,.9);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:60px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:3px;font-size:15px}
.brand .dot{width:16px;height:16px;border-radius:5px;background:var(--green)}
nav .links a{margin-left:22px;color:var(--muted);font-size:14px;font-weight:600}
nav .links a:hover,nav .links a.on{color:var(--text)}

header.hd{padding:40px 0 8px}
.kicker{color:var(--green);font-weight:800;letter-spacing:3px;font-size:12px;text-transform:uppercase}
h1{font-size:40px;margin:10px 0 4px;font-weight:800;letter-spacing:-.5px}
.sub{color:var(--muted);font-size:15px}

.tabs{display:flex;flex-wrap:wrap;gap:8px;padding:22px 0 6px;position:sticky;top:60px;
  background:var(--bg);z-index:40}
.tab{background:var(--card);color:var(--muted);border:1px solid var(--line);border-radius:20px;
  padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;transition:.15s;
  display:flex;align-items:center;gap:7px}
.tab:hover{color:var(--text)}
.tab.active{background:var(--green);color:#0B1119;border-color:var(--green)}
.tab .live{width:7px;height:7px;border-radius:50%;background:var(--red);
  box-shadow:0 0 0 0 rgba(240,98,93,.7);animation:pulse 1.8s infinite}
.tab.active .live{background:#0B1119;box-shadow:none;animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(240,98,93,.6)}70%{box-shadow:0 0 0 7px rgba(240,98,93,0)}100%{box-shadow:0 0 0 0 rgba(240,98,93,0)}}

.meta{display:flex;justify-content:space-between;align-items:center;
  color:var(--faint);font-size:12px;padding:14px 2px 16px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding-bottom:60px}
.game{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.game.livegame{border-color:var(--greendk)}
.ghead{display:flex;justify-content:space-between;align-items:center;
  font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;
  color:var(--faint);margin-bottom:12px}
.ghead .st.in{color:var(--green)} .ghead .st.post{color:var(--muted)} .ghead .st.pre{color:var(--amber)}
.row{display:flex;align-items:center;gap:11px;padding:7px 0}
.row img{width:24px;height:24px;object-fit:contain;flex:0 0 24px}
.row .nm{flex:1;font-weight:700;font-size:14.5px;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .rec{color:var(--faint);font-size:11px;font-weight:400;margin-left:6px}
.row .sc{font-weight:800;font-size:19px;font-variant-numeric:tabular-nums}
.row.lost .nm,.row.lost .sc{color:var(--muted)}
.row.won .sc{color:var(--green)}
.drawtag{margin-top:10px;color:var(--amber);font-size:11px;font-weight:800;letter-spacing:1px}
.empty{border:1px dashed var(--line);border-radius:12px;padding:46px 20px;text-align:center;
  color:var(--muted);grid-column:1/-1}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:6px}
.err{color:var(--red)}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}h1{font-size:32px}}
@media(max-width:620px){.grid{grid-template-columns:1fr}.tabs{top:60px}}
</style>
</head>
<body>

<nav><div class="wrap">
  <div class="brand"><span class="dot"></span>RIGORLYTICS</div>
  <div class="links">
    <a href="/">Home</a><a href="/scores" class="on">Scores</a>
    <a href="/research">Research</a><a href="/ask">Ask</a>
  </div>
</div></nav>

<header class="hd"><div class="wrap">
  <div class="kicker">Live &amp; Latest</div>
  <h1>Scores</h1>
  <div class="sub">Ten leagues, one board — pro and college football, basketball, baseball, hockey and soccer.</div>
</div></header>

<div class="wrap">
  <div class="tabs" id="tabs"></div>
  <div class="meta"><span id="label"></span><span id="stamp"></span></div>
  <div class="grid" id="grid"></div>
</div>

<script>
const LEAGUES = [
  {k:"nfl",  l:"NFL"},   {k:"cfb",  l:"CFB"},
  {k:"nba",  l:"NBA"},   {k:"mcbb", l:"MCBB"}, {k:"wcbb", l:"WCBB"},
  {k:"wnba", l:"WNBA"},  {k:"mlb",  l:"MLB"},  {k:"nhl",  l:"NHL"},
  {k:"epl",  l:"EPL"},   {k:"mls",  l:"MLS"}
];
const FULL = {nfl:"NFL",cfb:"NCAA Football",nba:"NBA",mcbb:"NCAA Men's Basketball",
  wcbb:"NCAA Women's Basketball",wnba:"WNBA",mlb:"MLB",nhl:"NHL",
  epl:"Premier League",mls:"Major League Soccer"};

let current = localStorage_safe() || "nfl";
let timer = null;

function localStorage_safe(){ try{ return null; }catch(e){ return null; } }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function drawTabs(live){
  const t = document.getElementById("tabs");
  t.innerHTML = LEAGUES.map(x=>{
    const n = live && live[x.k] ? live[x.k] : 0;
    return `<button class="tab ${x.k===current?"active":""}" data-k="${x.k}">`
         + (n>0?`<span class="live"></span>`:"") + esc(x.l) + `</button>`;
  }).join("");
  t.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{ current=b.dataset.k; load(); });
}

function team(side, other, isPre){
  const lost = (!isPre && other && other.winner && !side.winner) ? "lost" : "";
  const won  = side.winner ? "won" : "";
  const sc   = side.score==null ? "" : `<span class="sc">${esc(side.score)}</span>`;
  const logo = side.logo ? `<img src="${esc(side.logo)}" alt="" onerror="this.style.visibility='hidden'">`
                         : `<span style="width:24px;flex:0 0 24px"></span>`;
  return `<div class="row ${lost} ${won}">${logo}`
       + `<span class="nm">${esc(side.name)}`
       + (side.record?`<span class="rec">${esc(side.record)}</span>`:"")
       + `</span>${sc}</div>`;
}

function card(g){
  const isPre = g.state==="pre";
  return `<div class="game ${g.state==="in"?"livegame":""}">`
    + `<div class="ghead"><span>${esc(g.league_label)}</span>`
    + `<span class="st ${esc(g.state)}">${esc(g.status)}</span></div>`
    + team(g.away,g.home,isPre) + team(g.home,g.away,isPre)
    + (g.draw?`<div class="drawtag">DRAW</div>`:"")
    + `</div>`;
}

async function load(){
  drawTabs(window.__live||{});
  const grid=document.getElementById("grid");
  document.getElementById("label").textContent = FULL[current]||"";
  grid.innerHTML = `<div class="empty">Loading…</div>`;
  try{
    const r = await fetch(`/api/live/${current}`,{cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const d = await r.json();
    const games = d.games||[];
    grid.innerHTML = games.length
      ? games.map(card).join("")
      : `<div class="empty"><b>No games scheduled</b>${esc(FULL[current]||"")} has nothing on the board right now — likely between seasons.</div>`;
    window.__live = window.__live||{};
    window.__live[current] = games.filter(g=>g.state==="in").length;
    drawTabs(window.__live);
    document.getElementById("stamp").textContent =
      "Updated " + new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
  }catch(e){
    grid.innerHTML = `<div class="empty"><b class="err">Couldn't load scores</b>${esc(e.message)}</div>`;
  }
  clearTimeout(timer);
  timer = setTimeout(load, 60000);
}
load();
</script>
</body>
</html>
